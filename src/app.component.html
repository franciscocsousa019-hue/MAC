<div class="flex flex-col md:flex-row min-h-screen">
  <!-- Sidebar -->
  <aside class="w-full md:w-72 bg-slate-900 text-white flex flex-col">
    <div class="p-6">
      <h1 class="text-xl font-bold tracking-tight text-blue-400">MAC Protocol</h1>
      <p class="text-xs text-slate-400 mt-1 uppercase tracking-widest">Francisco Cesar de Sousa</p>
    </div>

    <nav class="flex-1 px-3 space-y-1">
      <button (click)="switchTab('dashboard')" class="nav-btn w-full text-left py-3 px-4 rounded-lg transition-all hover:bg-slate-800 flex items-center gap-3" [class.active-tab]="activeTab() === 'dashboard'">
        <span>📊</span> Dashboard MAC
      </button>
      <button (click)="switchTab('mapping')" class="nav-btn w-full text-left py-3 px-4 rounded-lg transition-all hover:bg-slate-800 flex items-center gap-3" [class.active-tab]="activeTab() === 'mapping'">
        <span>⚓</span> Mapear Âncoras
      </button>
      <button (click)="switchTab('tracker')" class="nav-btn w-full text-left py-3 px-4 rounded-lg transition-all hover:bg-slate-800 flex items-center gap-3" [class.active-tab]="activeTab() === 'tracker'">
        <span>🌡️</span> Deriva Somática
      </button>
      <button (click)="switchTab('therapy')" class="nav-btn w-full text-left py-3 px-4 rounded-lg transition-all hover:bg-slate-800 flex items-center gap-3" [class.active-tab]="activeTab() === 'therapy'">
        <span>🛠️</span> Intervenção
      </button>
    </nav>

    <div class="p-6 bg-slate-950/50">
      <div class="text-xs text-slate-500 mb-2">PROGRESSO DA TEORIA</div>
      <div class="w-full bg-slate-800 rounded-full h-1.5">
        <div class="bg-blue-500 h-1.5 rounded-full" style="width: 65%"></div>
      </div>
      <p class="text-[10px] mt-2 text-slate-400 italic">Pronto para submissão académica internacional.</p>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 p-6 md:p-10 overflow-y-auto">
    @switch (activeTab()) {
      @case ('dashboard') {
        <app-dashboard></app-dashboard>
      }
      @case ('mapping') {
        <app-mapping (anchorSaved)="switchTab('dashboard')"></app-mapping>
      }
      @case ('tracker') {
        <app-tracker></app-tracker>
      }
      @case ('therapy') {
        <app-therapy></app-therapy>
      }
    }
  </main>
</div>
